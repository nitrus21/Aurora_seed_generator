[platformio]
default_envs = waveshare-p4
src_dir = main

[env:waveshare-p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-p4_r3
framework = espidf
monitor_speed = 115200
extra_scripts =
    post:tools/reproducible_link.py
    post:tools/reproducible_elf.py
    post:tools/image_revision.py
board_upload.flash_size = 32MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
board_build.f_psram = 250000000L
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

[env:waveshare-p4-rev1]
extends = env:waveshare-p4
board = esp32-p4
board_build.f_psram = 200000000L
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.rev1.defaults"

; Temporary, public-data-only image for F51-07. It does not start the wallet UI
; and must never be packaged as a release firmware.
[env:waveshare-p4-rev1-kdf-benchmark]
extends = env:waveshare-p4-rev1
build_flags = -DAURORA_P4_KDF_BENCHMARK=1

; Temporary display-only image for F51-05. It reports aggregate counters and a
; verdict, never RNG words, digests, wallet data or microSD content.
[env:waveshare-p4-rev1-entropy-health]
extends = env:waveshare-p4-rev1
build_flags = -DAURORA_P4_ENTROPY_HEALTH=1

; Temporary, display-only image for INT-A1. It runs the normal UI and exposes
; only aggregate FreeRTOS stack high-water marks in the About screen.
[env:waveshare-p4-rev1-stack-health]
extends = env:waveshare-p4-rev1
build_flags = -DAURORA_P4_STACK_HEALTH=1
