name: Deploy AURORA Web Flasher to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "webflasher/**"
      - "tests/release/**"
      - "tools/webflasher/**"
      - ".github/workflows/deploy-webflasher-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Vérifier le contenu public
        run: python tools/check_public_repo.py

      - name: Vérifier la release P4 et les choix du Web Flasher
        shell: pwsh
        run: ./tests/release/verify_p4.ps1

      - name: Vérifier le bundle local depuis les dépendances verrouillées
        run: |
          npm ci --prefix tools/webflasher --ignore-scripts --no-audit --no-fund
          npm run check --prefix tools/webflasher

      - name: Préparer le Web Flasher
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./webflasher

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
